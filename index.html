    </tr>
  </tbody>
</table>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">Why metallized or coated layers stay flat?</h3>
<p>If you run a sensitivity sweep on a metallized film (like MET-PET) or an oxide-coated material (AlO<sub>x</sub>/SiO<sub>x</sub>), you will notice that the resulting graph line is completely flat. This is physical proof that the model is working correctly. The calculator treats these structures as surface shields: their gas-blocking properties are dictated entirely by the quality of the nanometric vacuum deposition, not by the thickness of the plastic carrier underneath. Changing a carrier film from 12 µm to 20 µm changes mechanical properties, but leaves the barrier resistance unchanged.</p>


<p>Use these graphic slopes to streamline your packaging specifications. By identifying structural plateaus, you can eliminate over-engineered components, reduce polymer plastic weights, minimize your eco-tax footprints, and cut production costs without risking standard food safety or chemical shelf-life metrics.</p>

</div>

</div>
</div>

    var qLower = q.toLowerCase();

    // 🆕 1. CONTROLLO FILTRO NUMERICO (es. "wvtr < 2", "otr > 100")
    // Riconosce: wvtr o otr, seguito da < > <= >=, seguito da un numero
    var numRegex = /^\s*(wvtr|otr|thickness)\s*(<=|>=|<|>|==|=)\s*([\d.]+)\s*$/i;
    var numMatch = q.match(numRegex);
    
    if(numMatch) {
      var type = numMatch[1].toLowerCase();
      var op = numMatch[2];
      var threshold = parseFloat(numMatch[3]);
      
      // Prendi i dati corretti in base a cosa ha scritto l'utente
      var targets = (type === 'wvtr' || type === 'otr') 
        ? (type === 'wvtr' ? (m.wvtrValues||[]) : (m.otrValues||[]))

      for(var v = 0; v < targets.length; v++) {

        var pass = false;
        
        // Confronto matematico
        if(op === '<') pass = val < threshold;
        else if(op === '>') pass = val > threshold;
        else if(op === '<=') pass = val <= threshold;
        else if(op === '>=') pass = val >= threshold;
        else if(op === '==' || op === '=') pass = val == threshold;
        
        if(pass) { 
          found = true;

        for(var li=0;li<lines.length;li++){
        // ✅ CORRETTO
var cols=lines[li].split(/,\s*|\t/).map(function(s){return s.trim();});
          if(cols.length<10) continue; // Min: Name,Family,TestM,IsMet,WVTR_v,WVTR_t,OTR_v,OTR_t,Temp,Hum
          
          var name=cols[0];
          var family=cols[1] || getFamily(cols[0]);
          var testMethod=cols[2] || '';
          var isMetallized=(cols[3]||'').toLowerCase()==='true';  // ← ✅ LETTURA FLAG
          
          var wvtr=parseFloat(cols[4])||0; var wvtrT=parseFloat(cols[5])||0;
          var otr=parseFloat(cols[6])||0; var otrT=parseFloat(cols[7])||0;
          
          var validConditions=[];
          for(var i=8;i<cols.length;i+=2){
            var te=parseFloat(cols[i]); var h=parseFloat(cols[i+1]);
            if(!isNaN(te)&&!isNaN(h)) validConditions.push({temperature:te,humidity:h});
          }
          if(name && validConditions.length>0){
            DB.addMat({
              name:name,
              family:family,
              testMethod:testMethod,
              isMetallized:isMetallized,  // ← ✅ SALVATO
              wvtrValues:[{value:wvtr,thickness:wvtrT}],
              otrValues:[{value:otr,thickness:otrT}],
              validConditions:validConditions
            });
            count++;
          }
        }
        alert('Imported '+count+' materials');render();return true;
      }catch(e){alert('Import error: '+e.message);return false;}
    }
  );
}

function importFile(input){
  var file=input.files[0];if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.materials){DB.importAll(JSON.stringify(data));alert('Imported '+data.materials.length+' materials');Modal.close();render();}
    }catch(err){alert('File import error: '+err.message);}
  };
  reader.readAsText(file);
}


// ====================================================================
// 📥 FUNZIONE: Carica materials.json esterno (DEFINITA PRIMA DELL'USO)
// ====================================================================
async function loadExternalMaterialsDB() {
    try {
        console.log('🔍 Tentativo di caricamento materials.json...');
        const res = await fetch('materials.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const externalMats = Array.isArray(data) ? data : (data.materials || []);
        if (!externalMats.length) {
            console.log('⚠️ Nessun materiale trovato in materials.json');
            return;
        }
        
        const existingNames = new Set(DB.materials.map(m => m.name.toLowerCase()));
        let addedCount = 0;
        
        for (const em of externalMats) {
            if (!em || !em.name) continue;
            const normalizedName = em.name.toLowerCase().trim();
            
            // ✅ CERCA SE ESISTE GIA' PER NOME
            var existing = DB.materials.find(m => m.name.toLowerCase() === em.name.toLowerCase());
            if (existing) {
                // ✅ AGGIORNA I CAMPI IGROSCOPICI SENZA DUPLICARE
                if (em.hygroscopicRefRHWVTR !== undefined) {
                    existing.hygroscopicRefRHWVTR = em.hygroscopicRefRHWVTR;
                    existing.hygroscopicRefRHOTR = em.hygroscopicRefRHOTR;
                    existing.hygroscopicBetaWVTR = em.hygroscopicBetaWVTR;
                    existing.hygroscopicBetaOTR = em.hygroscopicBetaOTR;
                }
                console.log('↻ Aggiornato:', em.name);
                continue; // ← ✅ NON CREARE DUPLICATO
            }
            
            // ✅ Assegna ID univoco sequenziale
            const numericIds = DB.materials
                .map(m => typeof m.id === 'number' ? m.id : 0)
                .filter(id => id > 0);
            const maxId = numericIds.length ? Math.max(...numericIds) : 0;
            em.id = maxId + 1 + addedCount;
            em.family = em.family || getFamily(em.name);
            em.isMetallized = em.isMetallized || false;
            
            if (!em.reliabilityVotes) em.reliabilityVotes = { up: 0, down: 0 };
            if (!em.company) em.company = '';
            if (!em.tdsLink) em.tdsLink = '';
            if (!em.testMethodWVTR) em.testMethodWVTR = '';
            if (!em.testMethodOTR) em.testMethodOTR = '';
            
            DB.materials.push(em);
            existingNames.add(normalizedName);
            addedCount++;
        }
        
        console.log('✅ External DB loaded:', addedCount, 'new materials');
        console.log('📊 Totale materiali:', DB.materials.length);
        DB.save();
        render();
    } catch (e) {
        console.log('ℹ️ materials.json non caricato (opzionale):', e.message);
    }
}

(async function initApp() {
  console.log("🚀 Avvio app...");
  
  // ⏳ Attendi Firebase (max 5s)
  let retries = 0;
  while(!window.communityDB && retries < 50) {
    await new Promise(resolve => setTimeout(resolve, 100));
    retries++;
  }
  
  try {
    // 1️⃣ Carica materiali locali (default + localStorage)
    DB.load();
    console.log("📦 Materiali locali:", DB.materials.length);
    
    // 2️⃣ Carica stato salvato
    var savedState = DB.loadState();
    if(savedState){
      if(savedState.layers) State.layers = savedState.layers;
      if(savedState.selCond) State.selCond = savedState.selCond;
      if(savedState.mode) { State.mode = savedState.mode; Engine.mode = savedState.mode; }
    }
    
    // 3️⃣ ✅ CARICA MATERIALS.JSON ESTERNO (database statico di base)
    await loadExternalMaterialsDB();
    
   // 4️⃣ Carica materiali Firebase (database community dinamico)
if(window.communityDB) {
    console.log("🔄 Caricamento community da Firebase...");
    const fbMats = await window.loadFromCommunity();
    console.log("📥 Firebase materials:", fbMats.length);
    
    const existingNames = new Set(DB.materials.map(m => m.name.toLowerCase()));
    let addedCount = 0;
   // Dentro initApp(), cerca questo blocco:
for(const fm of fbMats) {
    // ✅ MODIFICA: Cerca per nome O per firebaseDocId (se esiste)
    var localMat = DB.materials.find(m => 
        m.name.toLowerCase() === fm.name.toLowerCase() || 
        (m.firebaseDocId && m.firebaseDocId === fm.firebaseDocId)
    );
    
    if (localMat) {
        // ... (lascia il resto del codice di merge invariato)
        var oldId = localMat.id;
        Object.assign(localMat, fm);
        localMat.id = oldId;
        localMat.isCommunity = true;
        if(fm.firebaseDocId) localMat.firebaseDocId = fm.firebaseDocId;
    } else if (fm.name) {
        // ... (lascia il resto invariato)
        fm.id = 'fb_' + (fm.id || Date.now());
        fm.isCommunity = true;
        DB.materials.push(fm);
        addedCount++;
    }
}
    console.log("✅ Community aggiunti/aggiornati:", addedCount);
}
    
    // 5️⃣ Carica laminati dal cloud (sovrascrive localStorage se il cloud ha dati)
    if(window.loadLaminatesFromCloud) {
        const cloudLams = await window.loadLaminatesFromCloud();
        if(cloudLams.length > 0) {
            DB.laminates = cloudLams;
            DB.save();
        }
    }

    // 6️⃣ Renderizza l'app con tutti i materiali caricati
    console.log("🎨 Rendering...");
    render();
    
  } catch(e) {
    console.error("❌ Init error:", e);
    DB.materials = DEFAULT_MATERIALS.slice();
    render();
  }
})();
