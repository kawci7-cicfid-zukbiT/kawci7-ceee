            if (mat.validConditions && mat.validConditions.length > 0) {
                let bestCond = mat.validConditions[0];
                let minDiff = Math.abs(mat.validConditions[0].temperature - T);
                for (let ci = 0; ci < mat.validConditions.length; ci++) {
                    const diff = Math.abs(mat.validConditions[ci].temperature - T);
                    if (diff < minDiff) { minDiff = diff; bestCond = mat.validConditions[ci]; }
                }
                testRH = bestCond.humidity;
            }
            hygroFactor *= Math.exp(beta * (RH - testRH));
        }
    }
}
            const effectiveRate = baseRate * accel * hygroFactor;
            const O2_fraction = 0.21;
const transferred = effectiveRate * A * days * (res && res.type === 'otx' ? O2_fraction : 1);

// 🆕 MOISTURE ACCUMULATION CHART - Crescita umidità interna step-by-step
// ====================================================================
drawMoistureAccumulationChart(res) {
  destroyChart('slMoistureAcc');
  const canvas = document.getElementById('slMoistureAccChart');
  
  // Controlli di sicurezza iniziali
  if (!canvas || !res || res.type !== 'moisture' || typeof Chart === 'undefined') {
    console.log('⚠️ drawMoistureAccumulationChart: skipped (conditions not met)');
    return;
  }
  
  const ctx = canvas.getContext('2d');
  const rows = document.querySelectorAll('#sl-chain-rows tr');
  if (!rows.length) return;

  const prodKey = document.getElementById('sl-product')?.value;
  const prod = PRODUCTS_DB[prodKey];
  if (!prod || prod.type !== 'moisture') return;

  const M_crit = parseFloat(document.getElementById('sl-mcrit')?.value) || prod.M_crit;
  const M_init = parseFloat(document.getElementById('sl-minit')?.value) || prod.M_init;
  const A = parseFloat(document.getElementById('sl-area')?.value) || 0.1;
  const W = parseFloat(document.getElementById('sl-weight')?.value) || 100;

  let baseRate = 0;
  const srcRadio = document.querySelector('input[name="sl-source"]:checked');
  const source = srcRadio ? srcRadio.value : 'calc';
  if (source === 'manual') {
    baseRate = parseFloat(document.getElementById('sl-rate-manual')?.value) || 0;
  } else {
    baseRate = parseFloat(State.calcResult?.total) || 0;
  }
  if (!baseRate || baseRate <= 0) baseRate = 0.5;

  const labels = [], moisturePoints = [], pointDetails = [];
  let M_current = M_init;
  let dayCounter = 0;
  const T_test_std = 23;
const Psat_std = 0.61094 * Math.exp((17.625 * T_test_std) / (T_test_std + 243.04)) * 1000;
const dP_std = Psat_std * 0.50; // 50% RH standard ASTM F1249

  rows.forEach((r, idx) => {
    const name = r.querySelector('input[type="text"]')?.value || `Step ${idx+1}`;
    const T = parseFloat(r.querySelector('.sl-ct')?.value) || 25;
    const RH_out = parseFloat(r.querySelector('.sl-cr')?.value) || 65;
    const days = parseFloat(r.querySelector('.sl-cd')?.value) || 1;
    const Psat = 0.61094 * Math.exp((17.625 * T) / (T + 243.04)) * 1000;

    const Ea_kJ = parseFloat(document.getElementById('sl-ea')?.value) || 60;
    const Q10 = parseFloat(document.getElementById('sl-q10')?.value) || 2.0;
    let accel = 1;
    const eaInput = document.getElementById('sl-ea')?.value;
    const eaDisabled = document.getElementById('sl-ea')?.disabled;
    
    if (eaInput && parseFloat(eaInput) > 0 && !eaDisabled) {
      const R = 8.314;
      const Ea_J = Ea_kJ * 1000;
      accel = Math.exp(-(Ea_J / R) * (1 / (T + 273.15) - 1 / 298.15));
    } else {
      accel = Math.pow(Q10, (T - 25) / 10);
    }

    let hygroFactor = 1;
    if (State.layers) {
      for (let li = 0; li < State.layers.length; li++) {
        const layer = State.layers[li];
        if (!layer.mid) continue;
        const mat = DB.materials.find(m => m.id === layer.mid);
        if (!mat) continue;
        const beta = mat.hygroscopicBetaWVTR || 0;
        const refRH = mat.hygroscopicRefRHWVTR || 50;
        if (beta > 0) hygroFactor *= Math.exp(beta * (RH_out - refRH));
      }
    }

    const effectiveRate = baseRate * accel * hygroFactor;

    for (let d = 0; d < days; d++) {
      const aw_current = Math.min(0.99, Math.max(0.01, M_current / M_crit * 0.85));
      const RH_in = aw_current * 100;
      const dP = Psat * Math.max((RH_out - RH_in), 1) / 100;
      const rate_scale = dP / dP_std;
      const dM_day = (effectiveRate * rate_scale * A) / W * 100;
      M_current = Math.min(M_current + dM_day, M_crit * 1.5);
      dayCounter++;

      if (d % Math.max(1, Math.floor(days / 8)) === 0 || d === days - 1) {
        labels.push(`${name}+${d+1}d`);
        moisturePoints.push(parseFloat(M_current.toFixed(2)));
        pointDetails.push({ day: dayCounter, M: M_current, step: name });
      }
    }
    labels.push(name);
    moisturePoints.push(parseFloat(M_current.toFixed(2)));
    pointDetails.push({ day: dayCounter, M: M_current, step: name, isEnd: true });
  });

  const maxMoisture = moisturePoints.length > 0 ? Math.max(...moisturePoints) : M_crit;

  try {
    chartInstances.slMoistureAcc = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Internal Moisture (%)',
            data: moisturePoints,
            borderColor: '#3b82f6',
            backgroundColor: (ctx) => {
              const chart = ctx.chart;
              const { ctx: c, chartArea } = chart;
              if (!chartArea) return 'rgba(59,130,246,0.1)';
              const gradient = c.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
              gradient.addColorStop(0, 'rgba(59,130,246,0.15)');
              gradient.addColorStop(1, 'rgba(59,130,246,0.4)');
              return gradient;
            },
            fill: true,
            tension: 0.35,
            pointRadius: (ctx) => {
              const detail = pointDetails[ctx.dataIndex];
              return detail?.isEnd ? 5 : 3;
            },
            pointHoverRadius: 7,
            pointBackgroundColor: (ctx) => {
              const m = moisturePoints[ctx.dataIndex];
              if (m === undefined) return '#3b82f6';
              return m >= M_crit ? '#ef4444' : '#3b82f6';
            },
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            borderWidth: 2.5
          },
          {
            label: 'Critical Limit',
            data: new Array(labels.length).fill(M_crit),
            borderColor: '#ef4444',
            borderDash: [6, 4],
            borderWidth: 2.5,
            pointRadius: 0,
            fill: false
          }
        ]
      },
      options: {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: {
      position: 'top',
      labels: { boxWidth: 12, font: { size: 10 }, padding: 10 }
    },
    tooltip: {
      callbacks: {
        label: function(ctx) {
          const val = ctx.parsed.y;
          const detail = pointDetails[ctx.dataIndex];
          const status = val >= M_crit ? ' 🔴 ABOVE LIMIT' :
                        val >= M_crit * 0.9 ? ' 🟡 WARNING' : ' 🟢 Safe';
          return [
            ` ${ctx.dataset.label}: ${val.toFixed(2)}%${status}`,
            ` Day ${detail?.day || ctx.dataIndex}`,
            ` Step: ${detail?.step || ''}`
          ];
        }
      }
    }
  },
  scales: {
    x: {
      title: { display: true, text: 'Logistics Chain Progress', font: { size: 10 } },
      ticks: { font: { size: 8 }, maxRotation: 45, minRotation: 45 },
      grid: { display: false }
    },
    y: {
      beginAtZero: true,
      max: Math.max(M_crit * 1.3, (moisturePoints.length > 0 ? Math.max(...moisturePoints) : M_crit) * 1.1),
      title: { display: true, text: 'Moisture Content (%)', font: { size: 10 } },
      ticks: { callback: v => v.toFixed(1) + '%', font: { size: 9 } },
      grid: { color: 'rgba(0,0,0,0.04)' }
    }
  }
}  // ← ✅ CHIUSURA OPTIONS
});  // ← chiude new Chart()
} catch (e) {
  console.error('❌ Error creating Moisture Accumulation chart:', e);
 }
},

function calculateShelfLife() {
  var rate = parseFloat(document.getElementById('sl-rate').value);
  var area = parseFloat(document.getElementById('sl-area').value);
  var mass = parseFloat(document.getElementById('sl-mass').value);
  var initial = parseFloat(document.getElementById('sl-initial').value);
  var critical = parseFloat(document.getElementById('sl-critical').value);
  var unit = State.mode === 'wvtr' ? 'g/m²·day' : 'cc/m²·day';

  if (!rate || rate <= 0 || !area || area <= 0 || !mass || mass <= 0 || isNaN(initial) || isNaN(critical) || critical <= initial) {
  alert('⚠️ Please check the inputs: Critical Limit must be higher than Initial Level, and all values must be greater than 0.');
  return;
}

  // Formula: t = (W · ΔC) / (A · P)
  var delta = (critical - initial) / 100;
  var totalAllowedChange = mass * delta;
  var dailyTransmission = area * rate;
  var days = totalAllowedChange / dailyTransmission;

  var months = days / 30.44;
  var years = days / 365.25;

  var modeLabel = State.mode === 'wvtr' ? 'WVTR' : 'OTR';

  var resultHTML = `
    <div style="width:100%;animation:fadeIn 0.3s ease">
      <div style="font-size:2.8rem;font-weight:800;color:var(--primary);line-height:1.1">

          <span>Daily Transmission:</span>
          <strong style="color:var(--text)">${dailyTransmission.toFixed(4)} ${State.mode==='wvtr'?'g/day':'cc/day'}</strong>
        </div>
        <div style="display:flex;justify-content:space-between">
          <span>Max Allowed Change:</span>
          <strong style="color:var(--text)">${totalAllowedChange.toFixed(2)} ${State.mode==='wvtr'?'g':'cc'}</strong>

function calcPackageArea() {
    const shape = document.getElementById('sl-shape').value;
    const margin = parseFloat(document.getElementById('sl-margin').value) || 0;
    
    // Show/hide additional dimension fields based on shape
    const depthGroup = document.getElementById('depth-group');

    if(shape === 'box' || shape === 'tray') {
        depthGroup.style.display = 'block';
        diameterGroup.style.display = 'none';
    } else if(shape === 'cylinder') {
        depthGroup.style.display = 'none';
        diameterGroup.style.display = 'block';
    } else {
        depthGroup.style.display = 'none';
        diameterGroup.style.display = 'none';
    }
    const w = parseFloat(document.getElementById('sl-width-cm').value) || 0;
    const h = parseFloat(document.getElementById('sl-height-cm').value) || 0;
    const d = parseFloat(document.getElementById('sl-depth-cm').value) || 0;
    const diam = parseFloat(document.getElementById('sl-diameter-cm').value) || 0;
    
    let areaCm2 = 0;
    const wTotal = w + (margin * 2);
    const hTotal = h + (margin * 2);
    const dTotal = d + (margin * 2);
    switch(shape) {
        case 'flat':
            areaCm2 = 2 * wTotal * hTotal;
            break;
        case 'standup':
            areaCm2 = (2 * wTotal * hTotal) * 1.3;
            break;
        case 'flow':
            areaCm2 = wTotal * hTotal * 2.2;
            break;
        case 'box':
            areaCm2 = 2 * (wTotal * hTotal + wTotal * dTotal + hTotal * dTotal);
            break;
        case 'cylinder':
            const r = diam / 2;
            areaCm2 = 2 * Math.PI * r * (r + hTotal);
            break;
        case 'tray':
            areaCm2 = (wTotal * hTotal) + 2 * (wTotal * dTotal) + 2 * (hTotal * dTotal);
            break;
        case 'bag':
            areaCm2 = 2 * wTotal * hTotal * 1.1;
            break;
    }
    const areaM2 = areaCm2 / 10000;
    document.getElementById('sl-area-display').textContent = areaM2.toFixed(4) + ' m²';
    document.getElementById('sl-area').value = areaM2.toFixed(4);

function getPsat(T) {
  return 0.61094 * Math.exp((17.625 * T) / (T + 243.04));
}


function solveAwFromGAB(M, params) {
  if (!params || !params.M_m || !params.C || !params.K) return 0.5;
  
  let low = 0.01, high = 0.99;
  
  for (let i = 0; i < 50; i++) {
    const aw = (low + high) / 2;
    const denominator = (1 - params.K * aw) * (1 - params.K * aw + params.C * params.K * aw);
    
    if (denominator === 0) break;
    
    const M_calc = (params.M_m * params.C * params.K * aw) / denominator;
    
    if (M_calc < M) {
      low = aw;
    } else {
      high = aw;
    }
  }
  return (low + high) / 2;
}

/**
 * Calcola il fattore di accelerazione termica (Arrhenius o Q10)
 * @param {number} Ea_J - Energia di attivazione in J/mol
 * @param {number} Q10 - Fattore Q10 alternativo
 * @param {number} T_ref - Temperatura di riferimento (°C)
 * @param {number} T_target - Temperatura target (°C)
 * @returns {number} Fattore di accelerazione
 */
function getAccelFactor(Ea_J, Q10, T_ref, T_target) {
  if (Q10 && Q10 > 0) {
    return Math.pow(Q10, (T_target - T_ref) / 10);
  }
  if (Ea_J && Ea_J > 0) {
    const R = 8.314;
    const T_ref_K = T_ref + 273.15;
    const T_target_K = T_target + 273.15;
    return Math.exp(-(Ea_J / R) * (1 / T_target_K - 1 / T_ref_K));
  }
  return 1;
}

function calculateAdvancedShelfLife() {
  const prodId = document.getElementById('sl-product')?.value;
  const prod = PRODUCTS_DB[prodId];
  if (!prod) { alert("⚠️ Select a product type first"); return; }

  // === 1. GET INPUTS BASE ===

  const A = parseFloat(document.getElementById('sl-area').value) || 0.1;
  const rateInput = parseFloat(document.getElementById('sl-rate')?.value) || (State.calcResult?.total || 0);
  if (rateInput <= 0) { alert("Enter a valid rate"); return; }

  // === 2. DEFINISCI SUBITO T_store E RH_out CON DEFAULT ===
  // ✅ Questo risolve il problema: variabili sempre definite prima dell'uso
  let T_store = 25;
  let RH_out = 65;

  // === 3. LOGICA PER DETERMINARE VALORI EFFETTIVI ===
  const isChain = document.getElementById('sl-cond-chain')?.style.display !== 'none';
  
  if (isChain) {
    // Calcolo medio ponderato per catena logistica
    let totD = 0, wT = 0, wRH = 0;
    document.querySelectorAll('#sl-chain-rows tr').forEach(r => {
      const d = parseFloat(r.querySelector('.sl-cd')?.value) || 0;
      wT += (parseFloat(r.querySelector('.sl-ct')?.value) || 0) * d;
      wRH += (parseFloat(r.querySelector('.sl-cr')?.value) || 0) * d;
      totD += d;
    });
    if (totD > 0) {
      T_store = wT / totD;
      RH_out = wRH / totD;
    }
    // Se totD === 0, restano i default 25°C / 65%
  } else {
    // Modalità singola: leggi direttamente dagli input
    T_store = parseFloat(document.getElementById('sl-temp')?.value) || 25;
    RH_out = parseFloat(document.getElementById('sl-rh-ext')?.value) || 65;
  }

  // === 4. ORA PUOI USARE T_store E RH_out IN SICUREZZA ===
  // Calcolo Psat (ora T_store è sempre definito)
  const Psat = getPsat(T_store) * 1000;
  const dP_std = Psat * 0.5;

  // Thermal acceleration
  const Ea_kJ = parseFloat(document.getElementById('sl-ea')?.value) || 60;
  const Q10 = parseFloat(document.getElementById('sl-q10')?.value) || 2.0;
  const Ea_J = Ea_kJ * 1000;
  
  let accel = 1;
  if (Q10 > 0) {
    accel = Math.pow(Q10, (T_store - 25) / 10);
  } else if (Ea_J > 0) {
    const R = 8.314;
    accel = Math.exp(-(Ea_J / R) * (1 / (T_store + 273.15) - 1 / 298.15));
  }

  // Hygroscopic correction (ora RH_out è sempre definito)
  let hygroFactor = 1;
  let hygroMsg = [];
  if (State.layers && State.selCond) {
    for (let li = 0; li < State.layers.length; li++) {
      const layer = State.layers[li];
      if (!layer.mid) continue;
      const mat = DB.materials.find(m => m.id === layer.mid);
      if (!mat) continue;
      
      const isW = State.mode === 'wvtr';
      const beta = isW ? (mat.hygroscopicBetaWVTR || 0) : (mat.hygroscopicBetaOTR || 0);
      const ref = isW ? (mat.hygroscopicRefRHWVTR || 50) : (mat.hygroscopicRefRHOTR || 50);
      
      if (beta > 0) {
        const f = Math.exp(beta * (RH_out - ref));
        if (f > 1) {
          hygroFactor *= f;
          hygroMsg.push(`${mat.name}: ×${f.toFixed(2)} @ ${RH_out.toFixed(0)}% RH`);
        }
      }
    }
  }

  const effectiveRate = rateInput * accel * hygroFactor;

  // === 5. RESTO DEL CALCOLO (invariato) ===
  let result = {
    days: 0, history: [], mode: State.mode, type: prod.type,
    hygroWarning: hygroMsg.length ? { message: 'Hygroscopic correction', details: hygroMsg } : null,
    isChain: isChain
  };

  if (prod.type === 'moisture') {
    const M_crit = parseFloat(document.getElementById('sl-mcrit').value) || prod.M_crit;
    const M_init = parseFloat(document.getElementById('sl-minit').value) || prod.M_init;
    
    if (M_crit <= M_init) { alert('Critical moisture must be > initial'); return; }
    
    let M = M_init, t = 0;
    result.history = [{ t: 0, M: M, quality: 100 }];
    
    while (M < M_crit && t < 5000) {
      const aw = SL.solveGAB(M / 100, prod.GAB);
      const RH_in = aw * 100;
      const dP = Psat * Math.max((RH_out - RH_in), 1) / 100; // ✅ RH_out ora sicuro
      const rate_scale = dP / dP_std;
      const dM = (effectiveRate * rate_scale * A) / W * 100;
      
      M += dM; t += 1;
      const quality = Math.max(0, 100 - ((M - M_init) / (M_crit - M_init)) * 100);
      result.history.push({ t, M: Math.min(M, M_crit), quality });
    }
    result.days = t;
    result.M_crit = M_crit;
    result.M_init = M_init;
  } else {
    // Logica ossidazione (simile, ora con RH_out sicuro)
    const fatKg = prod.fat_kg || 0.3;
    const O2_crit = prod.O2_crit || 400;
    const totalO2 = O2_crit * fatKg;
    const O2_fraction = 0.21;
const dayO2 = effectiveRate * A * O2_fraction;
    
    if (dayO2 <= 0) {
      result.days = Infinity;
    } else {
      const days = totalO2 / dayO2;
      for (let d = 0; d <= Math.min(days * 1.2, 3650); d += 5) {
        const quality = Math.max(0, 100 - ((dayO2 * d) / totalO2) * 100);
        result.history.push({ t: d, quality });
      }
      result.days = Math.round(days);
    }
    result.type = 'otx';
  }

  SL.renderResult(result);
}

}

function updateSaveBtn(){var btn=document.getElementById('save-btn');if(btn) btn.disabled=State.laminateName.trim()==='';}
function onCondSelect(){
  var sel=document.getElementById('sel-cond');
  if(sel&&sel.value){var parts=sel.value.split('|');State.selCond={temperature:parseFloat(parts[0]),humidity:parseFloat(parts[1])};}
  else State.selCond=null;
  DB.saveState(State);
  if(State.autoCalc) doCalcSilent(); else renderContent();
}
  // ✅ Helper: controlla se un materiale passa il filtro test method
function passesTestMethodFilter(mat) {
  if(!State.selectedTestMethod) return true; // Nessun filtro attivo
  // ✅ Legge il campo corretto in base alla modalità
  var tm = State.mode === 'wvtr' ? (mat.testMethodWVTR || '') : (mat.testMethodOTR || '');
  if(!tm) return false; // Materiale senza metodo → nascosto se filtro attivo
  return tm.trim().toLowerCase() === State.selectedTestMethod.trim().toLowerCase();
}

// ✅ Handler: cambia filtro test method
function onTestMethodFilterChange(value) {
  State.selectedTestMethod = value || '';
  DB.saveState(State);
  renderContent(); // Ri-renderizza per applicare il filtro
}
function onLayerChange(i,field,val){
  if(field === 'mid' && val) recordMaterialUsage(val);
  if(field==='mid') State.layers[i].mid=val!==''?parseFloat(val):null;
  else State.layers[i].thick=parseFloat(val)||0;
  DB.saveState(State);
  if(State.autoCalc) doCalcSilent(); else renderContent();
}
function addLayer(){State.layers.push({mid:null,thick:0});DB.saveState(State);renderContent();}
function rmLayer(i){if(State.layers.length<=1) return;State.layers.splice(i,1);DB.saveState(State);renderContent();}
function toggleAutoCalc(){State.autoCalc=!State.autoCalc;renderContent();}
function doCalc(){
  if(!State.selCond){State.calcError='Select conditions first';State.calcResult=null;renderContent();return;}
  if(!State.layers.every(function(l){return l.mid!==null&&l.thick>0;})){State.calcError='Complete all layers';State.calcResult=null;renderContent();return;}
  var common=Engine.findCommonConditions(State.layers,DB.materials);
  if(common.error){State.calcError=common.error;State.calcResult=null;renderContent();return;}
  var result=Engine.calcTotal(State.layers,DB.materials,State.selCond);
  if(result.error){State.calcError=result.error;State.calcResult=null;}
  else{State.calcResult=result;State.calcError=null;}
  renderContent();
  if(State.calcResult&&!State.calcResult.error) setTimeout(postCalcRender,150);
}
function doCalcSilent(){
  if(!State.selCond) return;
  if(!State.layers.every(function(l){return l.mid!==null&&l.thick>0;})) return;
  var common=Engine.findCommonConditions(State.layers,DB.materials);
  if(common.error) return;
  var result=Engine.calcTotal(State.layers,DB.materials,State.selCond);
  if(!result.error){State.calcResult=result;State.calcError=null;renderContent();setTimeout(postCalcRender,150);}
}
function postCalcRender(){
  drawBarChart();
  drawLaminateCurveChart();
  drawHygroscopicTimeChart();
}
function doSaveLam(){
  var name=State.laminateName.trim();
  if(!name){alert('Enter a name');return;}
  if(!State.calcResult||State.calcResult.total<=0){alert('Calculate first');return;}
  var tt=0;for(var i=0;i<State.layers.length;i++) tt+=(State.layers[i].thick||0);
  var rec=Engine.checkRecyclability(State.layers,DB.materials);
  DB.addLam({name:name,total:State.calcResult.total,totalThickness:tt,humidity:State.selCond.humidity,temperature:State.selCond.temperature,mode:State.mode,recyclable:rec.recyclable,monoStructure:rec.monoStructure,layerCount:State.layers.length,layers:JSON.parse(JSON.stringify(State.layers))});
  State.laminateName='';
  var nameEl=document.getElementById('lam-name');if(nameEl) nameEl.value='';
  var btn=document.getElementById('save-btn');if(btn) btn.disabled=true;
  var fb=document.getElementById('save-feedback');
  if(fb) fb.innerHTML='<div class="alert alert-success" style="margin-top:.5rem">Saved!</div>';
  setTimeout(function(){var f=document.getElementById('save-feedback');if(f) f.innerHTML='';},3000);
}

function drawLaminateCurveChart(){
    var canvas = document.getElementById('lamCurveChart');
    if(!canvas || !State.calcResult) return;
    destroyChart('lamCurve');
    
    var unit = getUnit();
    var datasets = [];
    var allTemps = []; var allVals = [];
    
    // 1. Genera dataset per ogni layer (Materiali)
    for(var i = 0; i < State.layers.length; i++){
        var layer = State.layers[i];
        if(layer.mid === null || layer.thick <= 0) continue;
        var mat = null;
        for(var m = 0; m < DB.materials.length; m++) {
            if(DB.materials[m].id === layer.mid){ mat = DB.materials[m]; break; }
        }
        if(!mat) continue;
        
        var color = LAYER_COLORS[i % LAYER_COLORS.length];
        var vals = Engine.getValues(mat);
        var dataPoints = [];
        for(var j = 0; j < vals.length; j++){
            var cond = mat.validConditions[j];
            if(cond){
                var product = vals[j].value * vals[j].thickness;
                var resistance = layer.thick / product;
                var trans = resistance > 0 ? 1/resistance : 0;
                dataPoints.push({x: cond.temperature, y: trans});
                allTemps.push(cond.temperature); allVals.push(trans);
            }
        }
        datasets.push({
            label: mat.name, 
            data: dataPoints,
            borderColor: color,
            backgroundColor: color,
            borderWidth: 2,
            showLine: true,
            type: 'scatter',
            order: 2,
            pointRadius: 5,
            pointHoverRadius: 7
        });
        
        var p = Engine.calcArrheniusParams(mat);
        if(p.valid){
            var curveData = [];
            var tMin2 = mat.validConditions[0].temperature;
            var tMax2 = mat.validConditions[0].temperature;
            for(var cc = 0; cc < mat.validConditions.length; cc++){
                var tt2 = mat.validConditions[cc].temperature;
                if(tt2 < tMin2) tMin2 = tt2;
                if(tt2 > tMax2) tMax2 = tt2;
            }
            tMin2 -= 10; tMax2 += 10;
            for(var t = tMin2; t <= tMax2; t += 0.5){
                var transMat = Engine.predict(p.A, p.Ea, t);
                var product2 = transMat * Engine.getValues(mat)[0].thickness;
                var resistance2 = layer.thick / product2;
                var trans2 = resistance2 > 0 ? 1/resistance2 : 0;
                curveData.push({x: t, y: trans2});
                allTemps.push(t); allVals.push(trans2);
            }
            datasets.push({
                label: mat.name + ' (Fit)',
                data: curveData,
                borderColor: color,
                backgroundColor: 'transparent',
                borderWidth: 1.5,
                borderDash: [5, 3],
                pointRadius: 0,
                type: 'line',
                order: 1,
                showLine: true
            });
        }
    }
    
    // 2. Curva Laminato Totale
    var laminateCurve = [];
    if(allTemps.length > 0){
        var tMin3 = Math.min.apply(null, allTemps) - 5;
        var tMax3 = Math.max.apply(null, allTemps) + 5;
        for(var t3 = tMin3; t3 <= tMax3; t3 += 0.5){
            var totalR = 0; var valid = true;
            for(var li = 0; li < State.layers.length; li++){
                var ly = State.layers[li];
                if(ly.mid === null || ly.thick <= 0){ valid = false; break; }
                var mt = null;
                for(var mi = 0; mi < DB.materials.length; mi++) {
                    if(DB.materials[mi].id === ly.mid){ mt = DB.materials[mi]; break; }
                }
                if(!mt){ valid = false; break; }
                var condIdx = -1;
                for(var ci = 0; ci < mt.validConditions.length; ci++){
                    if(Math.abs(mt.validConditions[ci].temperature - t3) < 0.01){ condIdx = ci; break; }
                }
                if(condIdx >= 0){
                    var wv = Engine.getValues(mt)[condIdx];
                    if(wv.value <= 0.00001){ valid = false; break; }
                    var prod = wv.value * wv.thickness;
                    totalR += ly.thick / prod;
                } else {
                    var pp = Engine.calcArrheniusParams(mt);
                    if(pp.valid){
                        var transMat2 = Engine.predict(pp.A, pp.Ea, t3);
                        var prod2 = transMat2 * Engine.getValues(mt)[0].thickness;
                        totalR += ly.thick / prod2;
                    } else { valid = false; break; }
                }
            }
            if(valid && totalR > 0) laminateCurve.push({x: t3, y: 1/totalR});
        }
    }
    
    if(laminateCurve.length > 0) datasets.push({
        label: ' LAMINATE TOTAL', 
        data: laminateCurve,
        borderColor: '#dc2626',
        backgroundColor: 'rgba(220,38,38,0.1)',
        borderWidth: 2.5,
        pointRadius: 0,
        type: 'line',
        fill: false,
        order: 0
    });
    
    // ✅ Punto Calcolato Corrente (visibile sul grafico, nascosto da tooltip e legenda)
    if(State.selCond && State.calcResult && State.calcResult.total > 0 && !State.calcResult.isBarrier) {
        datasets.push({
            label: ' Calculated @ ' + State.selCond.temperature + '°C',
            data: [{x: State.selCond.temperature, y: State.calcResult.total}],
            borderColor: '#dc2626',
            backgroundColor: '#dc2626',
            borderWidth: 3,
            pointRadius: 8,
            pointHoverRadius: 10,
            pointBackgroundColor: '#fff',
            pointBorderColor: '#dc2626',
            type: 'scatter',
            showLine: false,
            order: -1
        });
    }
    
    if(datasets.length === 0) return;
    
    var ctx = canvas.getContext('2d');
    chartInstances.lamCurve = new Chart(ctx, {
        type: 'line',
        data: { datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'nearest', axis: 'x', intersect: false },
            plugins: {
                legend: { display: false },
                // ✅ ✅ ✅ FILTRO TOOLTIP: nasconde il punto calcolato ✅ ✅ ✅
                tooltip: {
                    filter: function(item){
                        return !item.dataset.label.includes('Calculated');
                    },
                    callbacks: {
                        label: function(ctx){
  var lbl = ctx.dataset.label || '';
  var prec = getDisplayPrecision();
  if(lbl.includes('LAMINATE TOTAL')) return ' LAMINATE: '+formatWithSigFigs(ctx.parsed.y, prec)+' '+getUnit();
  if(lbl.includes('(Fit)')) return lbl;
  return lbl+': '+formatWithSigFigs(ctx.parsed.y, prec)+' '+getUnit();
}
                    }
                }
            },
            scales: {
                x: {
                    type: 'linear',
                    title: { display: true, text: 'Temperature (°C)', font: { size: 10, weight: '600' } },
                    grid: { color: 'rgba(0,0,0,0.04)' },
                    ticks: { font: { size: 9 } }
                },
                y: {
                    title: { display: true, text: getLabel() + ' (' + unit + ')', font: { size: 10, weight: '600' } },
                    beginAtZero: true,
                    grid: { color: 'rgba(0,0,0,0.04)' },
                    ticks: { 
                        font: { size: 9 },
                       callback: function(value) {
  var prec = getDisplayPrecision();
  return value < 0.01 ? formatWithSigFigs(value, prec) : formatWithSigFigs(value, prec);
}
                    }
                }
            }
        }
    });
    
    // ✅ ✅ ✅ LEGENDA HTML: mostra solo materiali e laminato totale ✅ ✅ ✅
    var legendEl = document.getElementById('lamCurveLegend');
    if(legendEl){
        var html = '<div style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; margin-top:0.8rem;">';
        for(var d = 0; d < datasets.length; d++){
            var ds = datasets[d];
            var txt = ds.label || '';
            
            // ✅ FILTRA: nasconde il punto calcolato e le curve di fit dalla legenda
            if(txt.indexOf('Calculated') >= 0 || txt.indexOf('(Fit)') >= 0) {
                continue;
            }
            
            var col = ds.borderColor || ds.backgroundColor;
            if(!txt || !col) continue;
            
            html += '<div style="display:flex; align-items:center; gap:0.4rem; background:#fff; padding:0.35rem 0.6rem; border-radius:6px; border:1px solid var(--border); font-size:0.75rem; font-weight:500; color:var(--text);">';
            html += '<span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:'+col+'; flex-shrink:0;"></span>';
            html += '<span>' + txt + '</span>';
            html += '</div>';
        }
        html += '</div>';
        legendEl.innerHTML = html;
    }
}

function drawHygroscopicTimeChart() {
    var canvas = document.getElementById('hygroTimeChart');
    var hygroCard = document.getElementById('hygro-card');
    if(!canvas) return;
    destroyChart('hygroTime');
    var currentMode = State.mode || 'wvtr';
    var betaKey = currentMode === 'wvtr' ? 'hygroscopicBetaWVTR' : 'hygroscopicBetaOTR';
    var refKey = currentMode === 'wvtr' ? 'hygroscopicRefRHWVTR' : 'hygroscopicRefRHOTR';
    
    var hasHygro = State.layers.some(function(l){
        if(l.mid === null) return false;
        var mat = DB.materials.find(function(m){ return m.id === l.mid; });
        if(!mat) return false;
        var beta = mat[betaKey] || mat.hygroscopicBeta || 0;
        return beta > 0;
    });
    
    if(!hasHygro || !State.selCond) {
        if(hygroCard) hygroCard.style.display='none';
        return;
    }

    // ← ✅ RIMOSSA LA RIGA hygroCard.style.display='block' DA QUI

    var ctx = canvas.getContext('2d');
    var extRH = State.selCond.humidity;

    // ✅ Controlla se condizioni di calcolo = condizioni di test
    var allSameRH = true;
    for(var li2=0; li2<State.layers.length; li2++) {
        var layer2 = State.layers[li2];
        if(!layer2.mid || layer2.thick <= 0) continue;
        var mat2 = DB.materials.find(function(m){ return m.id === layer2.mid; });
        if(!mat2) continue;
        var beta2 = mat2[betaKey] || 0;
        if(beta2 <= 0) continue;
        if(mat2.validConditions && mat2.validConditions.length > 0) {
    let bestCond = mat2.validConditions[0];
    let minD = Math.abs(mat2.validConditions[0].temperature - State.selCond.temperature);
    for(let ci3 = 0; ci3 < mat2.validConditions.length; ci3++) {
        const d2 = Math.abs(mat2.validConditions[ci3].temperature - State.selCond.temperature);
        if(d2 < minD) { minD = d2; bestCond = mat2.validConditions[ci3]; }
    }
    if(Math.abs(bestCond.humidity - extRH) > 2) {
        allSameRH = false;
        break;
    }
} else {
    // ✅ Se validConditions è vuoto non possiamo sapere la RH di test
    // → assumiamo che le condizioni siano diverse → mostra il grafico
    allSameRH = false;
    break;
}
    }

    // ✅ NASCONDI se condizioni identiche, MOSTRA solo se diverse
    if(allSameRH) {
        if(hygroCard) hygroCard.style.display = 'none';
        return;
    }
    
    // ← ✅ MOSTRATA SOLO QUI, dopo aver verificato che serve
    if(hygroCard) hygroCard.style.display='block';

// Se tutte le condizioni coincidono, nascondi il grafico
    var timePoints = [], wvtrPoints = [];
    
    var diffusivityMap = {
        'EVOH': 1.0e-14, 'PET': 3.0e-13, 'Nylon': 1.5e-12, 'PA': 1.5e-12,
        'PVA': 2.0e-12, 'PP': 3.0e-11, 'PE': 8.0e-11, 'default': 1.0e-12
    };
    
    var fixedResistance = 0;
    var hygroLayers = [];
    
    for(var li=0; li<State.layers.length; li++) {
        var layer = State.layers[li];
        if(!layer.mid || layer.thick <= 0) continue;
        var mat = DB.materials.find(function(m){ return m.id === layer.mid; });
        if(!mat) continue;
        var vals = Engine.getValues(mat);
        var idx = -1;
        for(var ci=0; ci<mat.validConditions.length; ci++) {
            if(Math.abs(mat.validConditions[ci].temperature - State.selCond.temperature) < 0.01 &&
               Math.abs(mat.validConditions[ci].humidity - State.selCond.humidity) < 0.01) {
                idx = ci; break;
            }
        }
        if(idx < 0) continue;
        var wd = vals[idx];
        if(!wd || wd.value <= 0.00001) continue;
        
        var modeBeta = mat[betaKey] || mat.hygroscopicBeta || 0;
        var modeRefRH = mat[refKey] || mat.hygroscopicRefRH || 50;
        
       if(modeBeta > 0) {
    var D_base = diffusivityMap[mat.family] || diffusivityMap['default'];
    var T_K = State.selCond.temperature + 273.15;
    var T_ref = 298.15;
    var Ea = 45000;
    var R = 8.314;
    var D_corrected = D_base * Math.exp(-(Ea/R) * (1/T_K - 1/T_ref));
    var L_m = layer.thick * 1e-6;
    var tau_sec = Math.pow(L_m, 2) / (6 * D_corrected);
    var tau_days = tau_sec / 86400;
    var rhFactor = 1 + (extRH / 100) * 1.5;
    tau_days = tau_days / rhFactor;
    
    // ✅ TROVA LA RH DI TEST DEL MATERIALE
    var matTestRH = modeRefRH;
    if(mat.validConditions && mat.validConditions.length > 0) {
        var bestMatch = mat.validConditions[0];
        var minDiff = Math.abs(mat.validConditions[0].temperature - State.selCond.temperature);
        for(var ci2=0; ci2<mat.validConditions.length; ci2++) {
            var diff = Math.abs(mat.validConditions[ci2].temperature - State.selCond.temperature);
            if(diff < minDiff) { minDiff = diff; bestMatch = mat.validConditions[ci2]; }
        }
        matTestRH = bestMatch.humidity;
    }
    
    hygroLayers.push({
        mat: mat, thickness: layer.thick, refValue: wd.value,
        refThick: wd.thickness, beta: modeBeta, refRH: matTestRH, tau: tau_days
    });
        } else {
            var product = wd.value * wd.thickness;
            fixedResistance += layer.thick / product;
        }
    }
    
    // ✅ FIX: Se non ci sono layer igroscopici validi, mostra comunque il valore base
    if(hygroLayers.length === 0) {
        var baseWVTR = fixedResistance > 0.000001 ? 1 / fixedResistance : 0.000001;
        timePoints = [0, 10, 20, 30];
        wvtrPoints = [baseWVTR, baseWVTR, baseWVTR, baseWVTR];
    } else {
        var maxTau = 0;
        for(var h=0; h<hygroLayers.length; h++) {
            if(hygroLayers[h].tau > maxTau) maxTau = hygroLayers[h].tau;
        }
        var satTime = Math.min(300, Math.ceil(maxTau * 3));
        if(satTime < 10) satTime = 10;
        
        var minPoints = 30;
        var step = Math.max(1, Math.floor(satTime / minPoints));
        
       for(var t=0; t<=satTime; t+=step) {
    var totalR = fixedResistance;
    for(var hi=0; hi<hygroLayers.length; hi++) {
        var hl = hygroLayers[hi];
        var rhAvg = hl.refRH + (extRH - hl.refRH) * (1 - Math.exp(-t / hl.tau));
        var corrFactor = Math.exp(hl.beta * (rhAvg - hl.refRH));
                var product = hl.refValue * hl.refThick;
                var baseR = hl.thickness / product;
                var dynamicR = baseR / corrFactor;
                totalR += dynamicR;
            }
            // ✅ FIX: Evita divisione per zero o valori troppo piccoli
            var totalWVTR = totalR > 0.000001 ? 1 / totalR : 0.000001;
            timePoints.push(t);
            wvtrPoints.push(totalWVTR);
        }
    }
    
    var initialWVTR = wvtrPoints[0];
    var finalWVTR = wvtrPoints[wvtrPoints.length-1];
    var increasePct = initialWVTR > 0 ? ((finalWVTR - initialWVTR) / initialWVTR * 100).toFixed(1) : 0;
    
    // ✅ FIX: Calcola yMax dinamico per evitare grafico compresso
    var yMax = Math.max(initialWVTR, finalWVTR) * 1.5;
    if(yMax < 0.1) yMax = 0.1; // Minimo visibile
    
    chartInstances.hygroTime = new Chart(ctx, {
        type: 'line',
        data: {
            labels: timePoints,
            datasets: [
                {
                    label: 'Effective ' + getLabel() + ' (hygroscopic)',
                    data: wvtrPoints,
                    borderColor: '#ef4444',
                    backgroundColor: 'rgba(239,68,68,0.1)',
                    fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2
                },
                {
                    label: 'Initial (t=0)',
                    data: new Array(timePoints.length).fill(initialWVTR),
                    borderColor: '#22c55e', borderDash: [4,3], pointRadius: 0, borderWidth: 1
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 9 } } },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            var prec = getDisplayPrecision();
                            return ctx.dataset.label + ': ' + formatWithSigFigs(ctx.parsed.y, prec) + ' ' + getUnit();
                        },
                        afterLabel: function(ctx) {
                            if(ctx.dataIndex === timePoints.length-1 && initialWVTR > 0) {
                                var prec = getDisplayPrecision();
                                return '↑ +' + formatWithSigFigs(parseFloat(increasePct), prec) + '% vs initial';
                            }
                            return '';
                        }
                    }
                }
            },
            scales: {
                x: { title: { display: true, text: 'Days', font: { size: 10 } }, grid: { display: false } },
                y: {
                    title: { display: true, text: getLabel() + ' (' + getUnit() + ')', font: { size: 10 } },
                    beginAtZero: true,
                    suggestedMax: yMax,  // ✅ FIX: Scala dinamica
                    ticks: {
                        callback: function(value) {
                            var prec = getDisplayPrecision();
                            return formatWithSigFigs(value, prec);
                        }
                    }
                }
            }
        }
    });
    
    // 🐛 DEBUG: Conferma che i dati sono stati generati
    console.log("✅ Grafico generato:", {
        points: timePoints.length,
        initial: initialWVTR,
        final: finalWVTR,
        yMax: yMax
    });
}

function renderCalcMethodology() {
return `
<div class="card methodology-card" style="margin-top:1.5rem; border-left:4px solid var(--primary); background: var(--card);">
<div style="padding:1.2rem 1.5rem;">
<h2 style="font-family:Georgia, 'Times New Roman', serif; font-size:1.3rem; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:0.5rem; margin-bottom:1rem;">
Understanding the calculations
</h2>
<div style="font-size:0.95rem; line-height:1.8; color:#334155; font-family:Georgia, 'Times New Roman', serif;">

<p>When engineers design packaging for food, pharmaceuticals, or sensitive products, they often combine several thin layers of different materials. Each layer plays a specific role: one might block moisture, another might block oxygen, and another might provide structural strength or heat-sealability. But how do we mathematically predict how well the whole structure will perform? This calculator answers that question using a classic physics principle: the series resistance model.</p>

<p>Think of it like building an insulated wall to keep out the cold. A single brick lets some heat through. Add a layer of foam insulation, then another brick, then a vapor barrier and suddenly, the wall becomes incredibly effective. Each layer adds its own "resistance" to the thermal flow. Packaging works exactly the same way, except instead of blocking heat, we are blocking water vapor molecules (WVTR) or oxygen molecules (OTR).</p>

<div style="background:var(--primary-light); padding:0.8rem 1rem; border-radius:8px; border-left:3px solid var(--primary); margin:1rem 0; font-family:sans-serif; font-size:0.9rem;">
<strong>The Core Rule:</strong> The total barrier resistance of a laminate is simply the sum of the individual resistances of each layer. Because permeability is the physical opposite (the inverse) of resistance, the final transmission rate is calculated by dividing 1 by the total accumulated resistance.
</div>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">How single layer resistance is calculated</h3>
<p>For any uniform polymer film, gas transport under steady conditions follows Fick's Law. This means a material's resistance depends linearly on the thickness you use versus its baseline performance measured in a laboratory. To find a single layer's resistance, the calculator uses this exact formula:</p>

<div style="background:#f8fafc; padding:1.1rem; border-radius:6px; font-family:monospace; font-size:0.95rem; text-align:center; border:1px dashed var(--border); margin:1rem 0; color:#0f172a;">
R<sub>layer</sub> = Thickness<sub>input</sub> / (Permeability<sub>ref</sub> × Thickness<sub>ref</sub>)
</div>

<p>In plain words: the term <em>(Permeability<sub>ref</sub> × Thickness<sub>ref</sub>)</em> is a constant value representing the material's intrinsic barrier quality (often called the Permeation Coefficient). If you double the thickness of your layer, you double its mathematical resistance, which effectively cuts the amount of gas leaking through in half.</p>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">Combining layers (the multilayer math)</h3>
<p>When you stack multiple materials together to form a laminate sheet, the calculator mathematically chains them together by adding up their calculated resistances:</p>

<div style="background:#f8fafc; padding:1.1rem; border-radius:6px; font-family:monospace; font-size:0.95rem; text-align:center; border:1px dashed var(--border); margin:1rem 0; color:#0f172a;">
R<sub>total</sub> = R<sub>layer1</sub> + R<sub>layer2</sub> + ... + R<sub>layerN</sub><br><br>
Final Permeability (WVTR or OTR) = 1 / R<sub>total</sub>
</div>

<div style="background:#f0fdf4; padding:1rem; border-radius:8px; border-left:3px solid var(--success); margin:1.2rem 0; font-family:sans-serif; font-size:0.9rem;">
<strong style="color:#16a34a; font-size:0.95rem;"> A Step-by-Step example:</strong><br>
Let's calculate the final WVTR of a simple two-layer pouch made of <strong>PET (12 µm)</strong> and <strong>LDPE (50 µm)</strong>:<br>
<ul>
  <li><strong>Layer 1 (PET 12 µm):</strong> Laboratory reference says it has a WVTR of 30.0 at 12 µm. <br>
  <em>R<sub>PET</sub> = 12 / (30.0 × 12) = 1 / 30.0 = <strong>0.0333</strong></em></li>
  <li><strong>Layer 2 (LDPE 50 µm):</strong> Laboratory reference says it has a WVTR of 4.0 at 25 µm.<br>
  <em>R<sub>LDPE</sub> = 50 / (4.0 × 25) = 50 / 100 = <strong>0.5000</strong></em></li>
  <li><strong>Total Combined Resistance:</strong> R<sub>total</sub> = 0.0333 + 0.5000 = <strong>0.5333</strong></li>
  <li><strong>Final Laminate WVTR:</strong> 1 / 0.5333 = <strong style="color:#111;">1.87 g/m²·day</strong></li>
</ul>
Notice how the LDPE layer is providing the vast majority of the moisture resistance (0.5000 out of 0.5333 total), making it the true moisture barrier in this structure!
</div>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">Hygroscopic dynamics</h3>
<p>Some premium barrier materials, like EVOH or Polyamides (Nylon), are highly sensitive to water vapor. When environmental humidity rises, these polymers absorb water molecules, which act as plasticizers, loosening the polymer chains and accelerating gas leakage. To simulate this real-world risk, the calculator applies an exponential scaling factor to the material's resistance based on its experimental sensitivity coefficient (&beta;):</p>

<div style="background:#f8fafc; padding:1.1rem; border-radius:6px; font-family:monospace; font-size:0.95rem; text-align:center; border:1px dashed var(--border); margin:1rem 0; color:#0f172a;">
Corrected Permeability = Permeability<sub>base</sub> × e<sup>&beta; × (&Delta;RH)</sup>
</div>

<p>Where <em>&Delta;RH</em> represents the difference between your current storage humidity and the original lab testing condition. If you test an EVOH-based material in tropical humidity without calculating this factor, your physical barrier will break down much faster than an uncorrected calculation would predict.</p>

<div style="background:var(--warning-light); padding:0.8rem 1rem; border-radius:8px; border-left:3px solid var(--warning); margin:1rem 0; font-family:sans-serif; font-size:0.9rem;">
<strong>Info:</strong> If no &beta; (beta) coefficient is supplied in the database, the model assumes the material is completely immune to moisture damage. In tropical or high-condensation environments, this assumption will generate overly optimistic shelf-life estimates.
</div>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">Metallized and coated chields</h3>
<p>Metallized films (such as MET-PET) and nanometric ceramic coatings (like AlO<sub>x</sub> or SiO<sub>x</sub>) follow entirely different physical rules. Their barrier performance does not come from the bulk polymer thickness, but rather from an ultra-thin, atomic layer of aluminum or oxide deposited onto the surface. Because a thicker base film will not have a better aluminum layer, the calculator treats these specialty materials as having a fixed, constant permeability barrier, bypasssing the linear thickness division rule.</p>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">Reading your analysis matrix</h3>
<p>The percentage contribution shown for each layer helps you pinpoint exactly where your money and material thickness are being effectively used:</p>

<table style="width:100%; border-collapse:collapse; margin:1rem 0; font-family:sans-serif; font-size:0.88rem;">
  <thead>
    <tr style="background:#f1f5f9; border-bottom:2px solid var(--border);">
      <th style="padding:0.6rem; text-align:left;">Layer Resistance %</th>
      <th style="padding:0.6rem; text-align:left;">Physical Meaning</th>
      <th style="padding:0.6rem; text-align:left;">Design Optimization Action</th>
    </tr>
  </thead>
  <tbody>
    <tr style="border-bottom:1px solid var(--border);">
      <td style="padding:0.6rem; font-weight:bold; color:var(--danger);">&gt; 50%</td>
      <td>Primary Line of Defense</td>
      <td>This is your "weakest link". Tweaking this material or increasing its thickness yields the maximum performance return.</td>
    </tr>
    <tr style="border-bottom:1px solid var(--border);">
      <td style="padding:0.6rem; font-weight:bold; color:var(--warning);">20% – 50%</td>
      <td>Significant Contributor</td>
      <td>Provides active support. Balance its thickness to manage overall roll-stock costs.</td>
    </tr>
    <tr>
      <td style="padding:0.6rem; font-weight:bold; color:var(--success);">&lt; 10%</td>
      <td>Minor Barrier Role</td>
      <td>This layer is doing almost no barrier work. It is likely there for mechanical strength, sealing, or printing. Do not waste money increasing its thickness for barrier reasons.</td>
    </tr>
  </tbody>
</table>

<p>Finally, remember that simulations assume a perfect universe: uniform film gauges, zero pinholes, and flawless industrial lamination. In the actual manufacturing plant, converting stresses and thermal sealing will slightly shift these properties. Treat this tool as a high-velocity screening application for early-stage R&D, and always validate your definitive structures with physical laboratory testing.</p>

<div style="margin-top:1.5rem; padding:0.9rem; background:var(--bg); border-radius:8px; font-size:0.88rem; color:var(--text-light); border-left:4px solid var(--primary); font-family:sans-serif;">
<strong>Industrial Protocol Disclaimer:</strong> This methodology is built to support engineering design and educational workflows. For commercial legal specifications or regulatory packaging claims, model predictions must always be verified by empirical testing executed under international standards such as ASTM F1249, ASTM D3985, or ISO 15106.
</div>

</div>
</div>
</div>
`;
}

function renderArrheniusMethodology() {
  return `
  <div class="card methodology-card" style="margin-top:1rem; border-left:4px solid var(--primary);">
  <div style="padding:1.2rem 1.5rem;">
  <h2 style="font-family:Georgia, 'Times New Roman', serif; font-size:1.2rem; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:0.5rem; margin-bottom:1rem;">
   Understanding Arrhenius Analysis
  </h2>

  <div style="font-size:0.92rem; line-height:1.75; color:#334155; font-family:Georgia, 'Times New Roman', serif;">

  <!-- SECTION : WHAT IS IT -->
  <h3 style="font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:1.05rem; color:var(--primary-dark); margin:1.2rem 0 0.5rem 0; font-weight:700;">What is the Arrhenius equation, really?</h3>
  <p>At its heart, the Arrhenius equation helps us understand a simple but powerful idea: temperature changes how quickly molecules move through packaging materials. Whether you're measuring water vapor (WVTR) or oxygen (OTR), warmth gives molecules more energy to wiggle through tiny gaps in films and coatings.</p>
  
  <div style="background:var(--primary-light); padding:0.7rem; border-radius:8px; border-left:3px solid var(--primary); margin:0.8rem 0; font-family:sans-serif;">
  <strong>Think of it this way:</strong> Imagine trying to walk through a crowded room. When it's cool, people move slowly and you make progress gradually. When it's warm and energetic, everyone's moving faster—and so do the molecules trying to pass through your packaging. Arrhenius gives us the math to predict exactly how much faster.
  </div>

  <!-- SECTION : COLLECTING DATA -->
  <h3 style="font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:1.05rem; color:var(--primary-dark); margin:1.2rem 0 0.5rem 0; font-weight:700;">How do we gather the data needed?</h3>
  <p>To unlock Arrhenius predictions, you need at least two measurements of the same material taken at different temperatures, while keeping relative humidity steady. More points = more confidence.</p>

  <div style="background:#f8fafc; padding:0.9rem; border-radius:8px; border:1px dashed var(--border); margin:0.8rem 0;">
  <strong>Example: Building your dataset</strong>
  <table style="width:100%; font-size:0.85rem; margin-top:0.5rem; border-collapse:collapse;">
  <thead>
  <tr style="background:var(--bg); text-align:left;">
  <th style="padding:0.4rem 0.6rem;">Temperature</th>
  <th style="padding:0.4rem 0.6rem;">Humidity</th>
  <th style="padding:0.4rem 0.6rem;">Measured WVTR</th>
  </tr>
  </thead>
  <tbody>
  <tr><td style="padding:0.3rem 0.6rem; border-bottom:1px solid var(--border);">23°C</td><td style="padding:0.3rem 0.6rem; border-bottom:1px solid var(--border);">50% RH</td><td style="padding:0.3rem 0.6rem; border-bottom:1px solid var(--border);">0.8 g/m²·day</td></tr>
  <tr><td style="padding:0.3rem 0.6rem; border-bottom:1px solid var(--border);">38°C</td><td style="padding:0.3rem 0.6rem; border-bottom:1px solid var(--border);">50% RH</td><td style="padding:0.3rem 0.6rem; border-bottom:1px solid var(--border);">1.5 g/m²·day</td></tr>
  <tr><td style="padding:0.3rem 0.6rem;">50°C</td><td style="padding:0.3rem 0.6rem;">50% RH</td><td style="padding:0.3rem 0.6rem;">2.8 g/m²·day</td></tr>
  </tbody>
  </table>
  </div>

  <p style="font-size:0.85rem; color:var(--text-light); margin-top:0.5rem;">
  <strong>Quick note:</strong> Keep humidity consistent (within ±5%) across all tests. Because humidity affects permeability independently of temperature, and we want to isolate temperature's role.
  </p>

  <!-- SECTION : HOW THE CALCULATOR WORKS -->
  <h3 style="font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:1.05rem; color:var(--primary-dark); margin:1.2rem 0 0.5rem 0; font-weight:700;">What happens behind the scenes?</h3>
  <p>Once you've entered your multi-temperature data, here's how the calculator brings Arrhenius to life:</p>
  
  <ol style="padding-left:1.2rem; margin:0.5rem 0;">
  <li><strong>Transform the numbers:</strong> Temperatures get converted to Kelvin (K = °C + 273.15), and we take the natural logarithm of each WVTR/OTR value. This linearizes the relationship.</li>
  
  <li><strong>Plot and check alignment:</strong> We graph ln(WVTR) versus 1/T. If your points fall roughly along a straight line, congratulations—your material follows Arrhenius behavior!</li>
  
  <li><strong>Extract the key parameters:</strong>
  <ul style="padding-left:1rem; margin:0.3rem 0; font-size:0.9em;">
  <li><strong>Eₐ (Activation Energy):</strong> Measured in kJ/mol, this tells us how "temperature-sensitive" your material is. Higher Eₐ = bigger changes with temperature.</li>
  <li><strong>A (Pre-exponential Factor):</strong> A theoretical baseline value—think of it as the permeability the material would have at infinite temperature.</li>
  <li><strong>R² (Goodness of Fit):</strong> A score from 0 to 1 showing how well your data matches the Arrhenius model. Closer to 1.0 means more trustworthy predictions.</li>
  </ul>
  </li>
  
  <li><strong>Make predictions:</strong> With Eₐ and A in hand, the calculator can estimate WVTR/OTR at any temperature you specify—even ones you haven't tested yet.</li>
  </ol>

  <div style="background:#f8fafc; padding:0.9rem; border-radius:6px; font-family:monospace; font-size:0.9rem; text-align:center; border:1px dashed var(--border); margin:0.8rem 0;">
  <strong>The Equation:</strong><br>
  WVTR(T) = A · exp( -Eₐ / (R · T) )
  </div>

  <!-- SECTION : READING YOUR RESULTS -->
  <h3 style="font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:1.05rem; color:var(--primary-dark); margin:1.2rem 0 0.5rem 0; font-weight:700;">Making sense of your output</h3>
  <p>After running the analysis, you'll see an R² value. Here's how to interpret it:</p>
  
  <div style="display:grid; grid-template-columns:1fr; gap:0.5rem; margin:0.8rem 0;">
  <div style="background:var(--success-light); padding:0.6rem; border-radius:6px; border-left:3px solid var(--success);">
  <strong style="color:var(--success);">✓ R² ≥ 0.95:</strong> Excellent fit. Your data aligns beautifully with Arrhenius—predictions are highly reliable for both interpolation and cautious extrapolation.
  </div>
  <div style="background:var(--warning-light); padding:0.6rem; border-radius:6px; border-left:3px solid var(--warning);">
  <strong style="color:var(--warning);">⚠ 0.80 ≤ R² < 0.95:</strong> Reasonable fit. Predictions within your tested temperature range are generally trustworthy, but use extra caution when estimating values far outside that range.
  </div>
  <div style="background:var(--danger-light); padding:0.6rem; border-radius:6px; border-left:3px solid var(--danger);">
  <strong style="color:var(--danger);">✗ R² < 0.80:</strong> Weak fit. Your material may not follow Arrhenius behavior closely, or you may need more data points. Consider collecting additional measurements or investigating other influencing factors.
  </div>
  </div>

  <!-- SECTION: BEST PRACTICES -->
  <h3 style="font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:1.05rem; color:var(--primary-dark); margin:1.2rem 0 0.5rem 0; font-weight:700;">Tips for reliable, publication-ready results</h3>
  <ul style="padding-left:1.2rem; margin:0.5rem 0; font-size:0.9rem;">
  <li><strong>Spread your temperatures:</strong> Aim for at least 3 distinct temperatures spanning your expected storage or use conditions. Wider ranges improve prediction confidence.</li>
  <li><strong>Lock down humidity:</strong> Keep relative humidity consistent across all tests. Even small fluctuations can introduce noise that masks the true temperature effect.</li>
  <li><strong>Let samples equilibrate:</strong> Before measuring, ensure your material has fully adjusted to the test environment. Rushed measurements lead to scattered data.</li>
  <li><strong>Build in a safety margin:</strong> When extrapolating beyond your measured range (e.g., predicting performance at 5°C when you only tested 20–50°C), apply a 20–30% buffer to account for uncertainty.</li>
  <li><strong>Watch for phase changes:</strong> Some materials undergo structural shifts (like crystallization or glass transitions) at certain temperatures. These can cause deviations from Arrhenius behavior—flag them if you notice sudden changes in your data trend.</li>
  </ul>

  <!-- REFERENCES -->
  <h3 style="font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:1.05rem; color:var(--primary-dark); margin:1.2rem 0 0.5rem 0; font-weight:700;"> Further Reading & Standards</h3>
  <ul style="padding-left:1.2rem; margin:0.5rem 0; color:var(--text-light); font-size:0.85rem;">
  <li>ASTM F1249 / ISO 15106-3</li>
  <li>ASTM D3985 / ISO 15106-2</li>
  <li>Arrhenius, S. (1889). </li>
  <li>Robertson, G.L. (2016). </li>
  </ul>

  <div style="margin-top:1.5rem; padding:0.9rem; background:var(--bg); border-radius:8px; font-size:0.88rem; color:var(--text-light); border-left:4px solid var(--primary); font-family:sans-serif;">
  <strong>Operational note:</strong> This Arrhenius tool is designed to support research, development, and informed decision-making. For commercial shelf-life claims or regulatory submissions, always validate predictions with real-time or accelerated aging studies under actual storage conditions, and ensure compliance with applicable regulations (e.g., EU Regulation 1169/2011, FDA 21 CFR Part 101).
  </div>

  </div>
  </div>

function renderArrhenius() {
  var validCount = 0;
  var opts = '<option value="">Select a multi-temp material...</option>';
  
  for (var i = 0; i < DB.materials.length; i++) {
    var mat = DB.materials[i];
    var v = Engine.validateArrhenius(mat);

      var r = Engine.calcArrheniusParams(mat);
      var r2 = r.valid ? r.rSquared.toFixed(3) : '-';
      opts += '<option value="' + mat.id + '">' +
              mat.name + ' [R²=' + r2 + ']</option>';
      validCount++;
    }
  }

  // ✅ Contatore materiali validi
  var infoText = validCount > 0 
    ? validCount + ' materials available for prediction' 
    : 'No materials with multi-temperature data found';

  return '<div class="card"><h2>Arrhenius Analysis</h2>' +
    '<p style="font-size:.78rem;color:var(--text-light);margin-bottom:.75rem">' +
    'Predict ' + getLabel() + ' at unmeasured temperatures using the Arrhenius equation. ' +

    '<div class="grid grid-2">' +

// ✅ Funzione principale di calcolo Arrhenius
function onArrChange() {
  var selMat = document.getElementById('arr-mat');
  var selTemp = document.getElementById('arr-temp');
  var selEa = document.getElementById('arr-ea');
  var resEl = document.getElementById('arr-result');
  
  if (!selMat || !selTemp) return;
  
  var matId = parseFloat(selMat.value);
  var targetTemp = parseFloat(selTemp.value) || 25;
  
  // ✅ Leggi il valore Ea dal campo input (se presente)
  var customEaInput = selEa ? selEa.value.trim() : '';
  var customEa = customEaInput ? parseFloat(customEaInput) : NaN;
  
  if (!matId) {
    if (resEl) resEl.innerHTML = '';
    if (selEa) selEa.value = '';
    clearArrCanvas('arrTempCanvas');
    clearArrCanvas('arrLinCanvas');
    return;
  }
  
  var mat = null;
  for (var i = 0; i < DB.materials.length; i++) {
    if (DB.materials[i].id === matId) {
      mat = DB.materials[i];
      break;
    }
  }
  if (!mat) return;
  
  var A, EaUsed, rSquared = 1, warn = '', relClass = 'reliability-medium';
  
  // ✅ Se Ea non è stato inserito manualmente, calcolalo dai dati del materiale
  if (isNaN(customEa) || customEa <= 0) {
    var v = Engine.validateArrhenius(mat);
    if (!v.valid) {
      if (resEl) resEl.innerHTML = '<div class="alert alert-error">' + v.error + '</div>';
      clearArrCanvas('arrTempCanvas');
      clearArrCanvas('arrLinCanvas');
      return;
    }
    var r = Engine.calcArrheniusParams(mat);
    if (!r.valid) {
      if (resEl) resEl.innerHTML = '<div class="alert alert-error">' + r.error + '</div>';
      clearArrCanvas('arrTempCanvas');
      clearArrCanvas('arrLinCanvas');
      return;
    }
    // ✅ Auto-compila il campo Ea con il valore calcolato (in kJ/mol)
    if (selEa) selEa.value = (r.Ea / 1000).toFixed(2);
    EaUsed = r.Ea;
    A = r.A;
    rSquared = r.rSquared;
    relClass = rSquared > 0.95 ? 'reliability-high' : rSquared > 0.8 ? 'reliability-medium' : 'reliability-low';
  } else {
    // ✅ Ea manuale: ricalcola A con Ea fisso
    EaUsed = customEa * 1000; // Converti kJ → J
    var vals = Engine.getValues(mat);
    var R = Engine.R_GAS;
    var lnA_values = [];
    for (var i = 0; i < mat.validConditions.length; i++) {
      var tk = mat.validConditions[i].temperature + 273.15;
      if (vals[i] && vals[i].value > 0) {
        var lnA = Math.log(vals[i].value) + EaUsed / (R * tk);
        lnA_values.push(lnA);
      }
    }
    if (lnA_values.length > 0) {
      var lnA_mean = 0;
      for (var j = 0; j < lnA_values.length; j++) lnA_mean += lnA_values[j];
      lnA_mean /= lnA_values.length;
      A = Math.exp(lnA_mean);
      warn = '<div class="alert alert-warning">Using custom Eₐ = ' + customEa.toFixed(2) + ' kJ/mol</div>';
      relClass = 'reliability-low';
    } else {
      if (resEl) resEl.innerHTML = '<div class="alert alert-error">Cannot calculate A with custom Eₐ</div>';
      return;
    }
  }
  
  // Calcola la predizione
  var pred = Engine.predict(A, EaUsed, targetTemp);
  
  // Calcola range temperature per warning
  var minT = mat.validConditions[0].temperature, maxT = mat.validConditions[0].temperature;
  for (var i = 0; i < mat.validConditions.length; i++) {
    var t = mat.validConditions[i].temperature;
    if (t < minT) minT = t;
    if (t > maxT) maxT = t;
  }
  var isExtrapolation = targetTemp < minT - 1 || targetTemp > maxT + 1;
  if (isExtrapolation) {
    warn += '<div class="alert alert-warning">Extrapolation - target ' + targetTemp + '°C is outside measured range (' + minT.toFixed(0) + '-' + maxT.toFixed(0) + '°C)</div>';
  }
  
  // ✅ Mostra i risultati
  if (resEl) {
    resEl.innerHTML = warn +
      '<div class="reliability-meter ' + relClass + '">' + 
        (isNaN(customEaInput) || customEaInput === '' ? 'R²=' + (rSquared).toFixed(4) + ' ' : '') + 
        'Eₐ=' + (EaUsed / 1000).toFixed(2) + ' kJ/mol' +
      '</div>' +
      '<div class="grid grid-3" style="margin-top:.4rem">' +
        '<div><div style="font-size:.65rem;color:var(--text-light)">Activation Energy</div><div style="font-weight:700">' + (EaUsed / 1000).toFixed(2) + ' kJ/mol</div></div>' +
        '<div><div style="font-size:.65rem;color:var(--text-light)">Pre-exponential A</div><div style="font-weight:700">' + A.toExponential(3) + '</div></div>' +
        '<div><div style="font-size:.65rem;color:var(--text-light)">Predicted at ' + targetTemp + '°C</div><div style="font-size:1rem;font-weight:700;color:var(--primary)">' + pred.toFixed(6) + '</div></div>' +
      '</div>';
  }
  
  // ✅ Prepara i dataPoints per i grafici
  var dataPoints = [];
  var vals = Engine.getValues(mat);
  for (var i = 0; i < mat.validConditions.length; i++) {
    if (vals[i] && vals[i].value > 0 && mat.validConditions[i]) {
      dataPoints.push({
        T_K: mat.validConditions[i].temperature + 273.15,
        trans: vals[i].value
      });
    }
  }
  
  // ✅ Disegna i grafici
  drawArrTempChart(mat, {
    A: A,
    Ea: EaUsed,
    predicted: pred,
    targetTempC: targetTemp,
    minTemp: minT,
    maxTemp: maxT,
    isExtrapolation: isExtrapolation,
    dataPoints: dataPoints,
    rSquared: rSquared
  }, customEaInput !== '');
  
  drawArrLinChart(mat, {
    A: A,
    Ea: EaUsed,
    dataPoints: dataPoints,
    rSquared: rSquared
  }, customEaInput !== '');
}

// ✅ Pulisce un canvas Arrhenius
function clearArrCanvas(id) {
  var c = document.getElementById(id);
  if (!c) return;
  
  destroyChart(id.replace('Canvas', ''));
  
  var ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio > 2 ? 2 : window.devicePixelRatio;
  var width = c.clientWidth || 500;
  var height = c.clientHeight || 280;
  
  c.width = width * dpr;
  c.height = height * dpr;
  c.style.width = width + 'px';
  c.style.height = height + 'px';
  
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#94a3b8';
  ctx.font = window.innerWidth < 480 ? '11px sans-serif' : '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Select a multi-temp material', width / 2, height / 2);
}

// ✅ Disegna il grafico WVTR/OTR vs Temperatura
function drawArrTempChart(mat, r, isCustomEa) {
  destroyChart('arrTemp');
  var canvas = document.getElementById('arrTempCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  
  var ctx = canvas.getContext('2d');
  var vals = Engine.getValues(mat);
  var dataPoints = [];
  
  if (mat.validConditions && vals) {
    for (var i = 0; i < mat.validConditions.length; i++) {
      var cond = mat.validConditions[i];
      var val = vals[i];
      if (cond && cond.temperature != null && val && val.value != null && val.value > 0) {
        dataPoints.push({ x: cond.temperature, y: val.value });
      }
    }
  }
  
  var datasets = [{
    label: 'Measured data',
    data: dataPoints,
    borderColor: '#ef4444',
    backgroundColor: '#ef4444',
    borderWidth: 0,
    pointRadius: 6,
    pointHoverRadius: 8,
    type: 'scatter',
    order: 1
  }];
  
  if (r && !r.error && r.A && r.Ea) {
    var curveData = [];
    var tMin4 = (r.minTemp || 20) - 10;
    var tMax4 = (r.maxTemp || 50) + 10;
    for (var t = tMin4; t <= tMax4; t += 0.5) {
      var w = Engine.predict(r.A, r.Ea, t);
      if (w > 0 && isFinite(w)) curveData.push({ x: t, y: w });
    }
    datasets.push({
      label: 'Arrhenius fit',
      data: curveData,
      borderColor: '#3b82f6',
      backgroundColor: 'transparent',
      borderWidth: 2,
      pointRadius: 0,
      type: 'line',
      order: 0
    });
    if (r.targetTempC != null && r.predicted != null) {
      datasets.push({
        label: 'Target: ' + r.targetTempC + ' → ' + r.predicted.toFixed(4),
        data: [{ x: r.targetTempC, y: r.predicted }],
        borderColor: '#22c55e',
        backgroundColor: '#22c55e',
        borderWidth: 0,
        pointRadius: 8,
        pointHoverRadius: 10,
        type: 'scatter',
        order: 0
      });
    }
  }
  
  var isMobile = window.innerWidth < 480;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  chartInstances.arrTemp = new Chart(ctx, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      devicePixelRatio: dpr,
      onResize: function(chart) {
        if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
          setTimeout(function() { chart.resize(); }, 100);
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: isMobile ? 10 : 12, font: { size: isMobile ? 9 : 10 }, padding: isMobile ? 8 : 12 }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              var label = context.dataset.label || '';
              if (label) label += ': ';
              if (context.parsed.y !== null) {
                label += context.parsed.y.toFixed(4) + ' ' + getUnit();
              }
              return label;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Temperature (°C)', font: { size: isMobile ? 10 : 11 } },
          ticks: { font: { size: isMobile ? 9 : 10 } },
          grid: { display: !isMobile }
        },
        y: {
          title: { display: true, text: getLabel() + ' (' + getUnit() + ')', font: { size: isMobile ? 10 : 11 } },
          beginAtZero: true,

        }
      }

// ✅ Disegna il grafico lineare Arrhenius (ln(WVTR) vs 1/T)
function drawArrLinChart(mat, r, isCustomEa) {
  destroyChart('arrLin');
  var canvas = document.getElementById('arrLinCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  
  var ctx = canvas.getContext('2d');
  
  if (!r || !r.dataPoints || r.dataPoints.length < 2 || !r.A || !r.Ea) {
    var isMobile = window.innerWidth < 480;
    ctx.fillStyle = '#94a3b8';
    ctx.font = isMobile ? '11px sans-serif' : '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Need 2+ valid data points', canvas.clientWidth / 2 || 250, 140);
    return;
  }
  
  var dps = r.dataPoints;
  var dataPoints = [];
  for (var i = 0; i < dps.length; i++) {
    if (dps[i].T_K > 0 && dps[i].trans > 0) {
      dataPoints.push({ x: 1 / dps[i].T_K, y: Math.log(dps[i].trans) });
    }
  }
  
  if (dataPoints.length < 2) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Need 2+ valid data points', canvas.clientWidth / 2, canvas.clientHeight / 2);
    return;
  }
  
  var slope = -r.Ea / Engine.R_GAS;
  var intercept = Math.log(r.A);
  var minX2 = dataPoints[0].x, maxX2 = dataPoints[0].x;
  for (var d = 0; d < dataPoints.length; d++) {
    if (dataPoints[d].x < minX2) minX2 = dataPoints[d].x;
    if (dataPoints[d].x > maxX2) maxX2 = dataPoints[d].x;
  }
  minX2 *= 0.98;
  maxX2 *= 1.02;
  
  var datasets = [
    {
      label: 'Experimental',
      data: dataPoints,
      borderColor: '#ef4444',
      backgroundColor: '#ef4444',
      borderWidth: 0,
      pointRadius: 6,
      pointHoverRadius: 8,
      type: 'scatter',
      order: 1
    },
    {
      label: 'Linear fit' + (isCustomEa ? ' (custom Eₐ)' : ''),
      data: [
        { x: minX2, y: slope * minX2 + intercept },
        { x: maxX2, y: slope * maxX2 + intercept }
      ],
      borderColor: '#3b82f6',
      backgroundColor: 'transparent',
      borderWidth: 2,
      pointRadius: 0,
      type: 'line',
      order: 0
    }
  ];
  
  var isMobile = window.innerWidth < 480;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  chartInstances.arrLin = new Chart(ctx, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      devicePixelRatio: dpr,
      onResize: function(chart) {
        if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
          setTimeout(function() { chart.resize(); }, 100);
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: isMobile ? 10 : 12, font: { size: isMobile ? 9 : 10 }, padding: isMobile ? 8 : 12 }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: '1/T (K⁻¹)', font: { size: isMobile ? 10 : 11 } },
          ticks: { font: { size: isMobile ? 9 : 10 }, maxRotation: isMobile ? 45 : 0, minRotation: isMobile ? 45 : 0 },
          grid: { display: !isMobile }
        },
        y: {
          title: { display: true, text: 'ln(' + getLabel() + ')', font: { size: isMobile ? 10 : 11 } },
          ticks: { font: { size: isMobile ? 9 : 10 } },
          grid: { display: !isMobile }
        }
      }
    }
  });
}

function onSensChange(){State.sensLayerIdx=parseInt(document.getElementById('sens-layer')?document.getElementById('sens-layer').value:'0');drawSensitivityChart();}
function postSensitivityRender(){if(State.layers.some(function(l){return l.mid!==null;})) setTimeout(function(){drawSensitivityChart();doOptimize();},100);}

function drawSensitivityChart(){
  var canvas = document.getElementById('sensChart');
  if(!canvas) return;
  destroyChart('sens');
  
  var layerIdx = State.sensLayerIdx;
  var tMin = parseFloat(document.getElementById('sens-tmin')?.value || '10');
  var tMax = parseFloat(document.getElementById('sens-tmax')?.value || '500');
  
  // Verifica prerequisiti
  if(!State.layers || State.layers.length === 0){
    showSensitivityEmpty('Add layers in Calculator first');
    return;
  }
  
  var common = Engine.findCommonConditions(State.layers, DB.materials);
  if(common.error){
    showSensitivityEmpty(common.error);
    return;
  }
  
  var condition = State.selCond || (common.conditions && common.conditions[0]) || {temperature:25, humidity:50};
  
  // Verifica che il layer selezionato esista e abbia un materiale
  var targetLayer = State.layers[layerIdx];
  if(!targetLayer || targetLayer.mid === null){
    showSensitivityEmpty('Select a valid layer to vary');
    return;
  }
  
  var result = Engine.calcSensitivityCurve(State.layers, DB.materials, condition, layerIdx, tMin, tMax, 80);
  
  if(result.error || !result.points || result.points.length === 0){
    showSensitivityEmpty(result.error || 'No valid data points');
    return;
  }
  
  var ctx = canvas.getContext('2d');
  var labels = result.points.map(p => p.thickness.toFixed(0));
  var vals = result.points.map(p => parseFloat(p.total.toFixed(6)));
  
  // ✅ Evita grafico con tutti valori zero
  var allZero = vals.every(v => v === 0);
  if(allZero){
    showSensitivityEmpty('All calculated values are zero');
    return;
  }
  
  chartInstances.sens = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: getLabel() + ' vs Layer ' + (layerIdx+1) + ' thickness',
        data: vals,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 0,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { title: { display: true, text: 'Layer thickness (µm)' } },
        y: {
          title: { display: true, text: 'Total ' + getLabel() + ' (' + getUnit() + ')' },
          beginAtZero: true,
          ticks: { callback: function(v){ return v < 0.01 ? v.toExponential(2) : v.toFixed(4); } }
        }
      }
    }
  });
}

  ctx.fillStyle = '#f8fafc';

function doOptimize(){
  var target=parseFloat(document.getElementById('opt-target')?document.getElementById('opt-target').value:'0.5');
  var barrierIdx=parseInt(document.getElementById('opt-layer')?document.getElementById('opt-layer').value:'0');

function renderSensitivityMethodology() {
return `
<div class="card methodology-card" style="margin-top:1.5rem; border-left:4px solid var(--primary); background: var(--card);">

Mechanics of Sensitivity Analysis
</h2>
<div style="font-size:0.95rem; line-height:1.8; color:#334155; font-family:Georgia, 'Times New Roman', serif;">

<p>In packaging optimization, a common question arises: <em>"What happens if we make this specific layer thinner to save money, or thicker to extend shelf life?"</em> Not all layers impact the final structure equally. Sensitivity Analysis is a powerful mathematical stress-test that answers this question. By sweeping the thickness of a single selected layer across a wide range while keeping all other layers locked, the model plots a dynamic trajectory showing exactly where you get the most "bang for your buck."</p>

<div style="background:var(--primary-light); padding:0.8rem 1rem; border-radius:8px; border-left:3px solid var(--primary); margin:1rem 0; font-family:sans-serif; font-size:0.9rem;">
<strong>The Mathematical Phenomenon:</strong> Even though a single layer's resistance scales linearly with its thickness, the final transmission rate (WVTR/OTR) of the laminate changes non-linearly. This creates a distinct curve because the variable layer is constantly shifting its percentage share of the global resistance pool.
</div>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">The math under the hood</h3>
<p>To plot your sensitivity curve, the calculator isolates the chosen layer and executes an iterative loops calculation. It samples multiple thickness points (ranging from thin to thick) and for every step, it re-computes Fick's resistance formula and recombines it into the global series model:</p>

<div style="background:#f8fafc; padding:1.1rem; border-radius:6px; font-family:monospace; font-size:0.95rem; text-align:center; border:1px dashed var(--border); margin:1rem 0; color:#0f172a;">
R<sub>variable</sub>(t) = Thickness<sub>sampled</sub> / (Permeability<sub>ref</sub> × Thickness<sub>ref</sub>)<br><br>
R<sub>total</sub>(t) = R<sub>fixed_layers</sub> + R<sub>variable</sub>(t)<br><br>
Laminate Permeability(t) = 1 / R<sub>total</sub>(t)
</div>

<h3 style="font-size:1.1rem; color:var(--text); margin:1.2rem 0 0.5rem 0; font-family:sans-serif;">How to read the sensitivity chart</h3>
<p>When you analyze the generated curve, your eyes should look for specific geometric patterns that dictate engineering decisions:</p>

<table style="width:100%; border-collapse:collapse; margin:1rem 0; font-family:sans-serif; font-size:0.88rem;">
  <thead>
    <tr style="background:#f1f5f9; border-bottom:2px solid var(--border);">

    <tr style="border-bottom:1px solid var(--border);">
      <td style="padding:0.6rem; font-weight:bold; color:var(--danger);">The Steep Cliff</td>
      <td>Critical Threshold Zone</td>
      <td>Reducing thickness even by 1 or 2 microns here will cause a catastrophic spike in gas transmission. This is a high-risk zone for product shelf life.</td>
    </tr>
    <tr style="border-bottom:1px solid var(--border);">
      <td style="padding:0.6rem; font-weight:bold; color:var(--warning);">The "Knee" (Inflection)</td>

      <td>System Bottleneck</td>
